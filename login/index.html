<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Esteveny's Coleman – Livraria</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body {
      background: linear-gradient(to bottom, #f8f9fc, #e0e7ff);
      padding: 40px 20px;
      text-align: center;
    }
    body.dark {
      background: linear-gradient(to bottom, #0f172a, #1e293b);
    }
    .welcome {
      font-size: 2.8rem;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #7c3aed, #d946ef);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: fadeIn 1.2s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .btn-logout {
      margin-top: 2rem;
      padding: 12px 32px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1 class="welcome">Bem-vindo à Esteveny's Coleman</h1>
  <p style="font-size:1.3rem; max-width:600px; margin:0 auto 2rem;">
    Aqui encontras os melhores livros de desenvolvimento pessoal, autoajuda e muito mais.
  </p>

  <button class="btn primary" onclick="alert('Em construção – em breve terás o catálogo completo!')">
    Ver livros
  </button>

  <button class="btn-logout" onclick="logout()">
    Terminar sessão
  </button>

  <script>
    // Proteção – se não tiver user → volta para login
    if (!localStorage.getItem('user')) {
      window.location.href = "auth.html";
    }

    function logout() {
      if (confirm("Queres mesmo terminar a sessão?")) {
        localStorage.removeItem('user');
        window.location.href = "auth.html";
      }
    }

    // Nome do usuário (opcional)
    const user = JSON.parse(localStorage.getItem('user'));
    if (user && user.name) {
      document.querySelector('.welcome').textContent = `Bem-vindo, ${user.name}!`;
    }
  </script>

</body>
</html>
