<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Esteveny's Coleman - Autenticação</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="auth-container">
  <div class="auth-card" id="authCard">

    <!-- Cabeçalho com toggle tema -->
    <div class="auth-header">
      <h1 id="formTitle">Bem-vindo de volta</h1>
      <i class="fas fa-moon theme-toggle" id="themeToggle"></i>
    </div>

    <!-- Formulário Login -->
    <form id="loginForm" class="auth-form active">
      <div class="input-group">
        <label>E-mail</label>
        <input type="email" id="loginEmail" required placeholder="exemplo@dominio.com"/>
      </div>
      <div class="input-group">
        <label>Palavra-passe</label>
        <input type="password" id="loginPassword" required placeholder="••••••••"/>
      </div>
      <button type="submit" class="btn primary">Entrar</button>
      <p class="toggle-text">
        Ainda não tens conta? <a href="#" id="toRegister">Criar conta</a>
      </p>
    </form>

    <!-- Formulário Cadastro -->
    <form id="registerForm" class="auth-form">
      <div class="input-group">
        <label>Nome completo</label>
        <input type="text" id="registerName" required placeholder="O teu nome"/>
      </div>
      <div class="input-group">
        <label>E-mail</label>
        <input type="email" id="registerEmail" required placeholder="exemplo@dominio.com"/>
      </div>
      <div class="input-group">
        <label>Palavra-passe</label>
        <input type="password" id="registerPassword" required placeholder="Mínimo 6 caracteres"/>
      </div>
      <button type="submit" class="btn primary">Criar conta</button>
      <p class="toggle-text">
        Já tens conta? <a href="#" id="toLogin">Entrar</a>
      </p>
    </form>

  </div>
</div>

<script>
// ======================== Tema claro/escuro ========================
const themeToggle = document.getElementById('themeToggle');
const currentTheme = localStorage.getItem('theme') || 'light';
if (currentTheme === 'dark') {
  document.body.classList.add('dark');
  themeToggle.classList.replace('fa-moon', 'fa-sun');
}

themeToggle.addEventListener('click', () => {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  themeToggle.classList.toggle('fa-moon', !isDark);
  themeToggle.classList.toggle('fa-sun', isDark);
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
});

// ======================== Toggle entre Login e Cadastro ========================
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');
const formTitle = document.getElementById('formTitle');
const toRegister = document.getElementById('toRegister');
const toLogin = document.getElementById('toLogin');

function showLogin() {
  loginForm.classList.add('active');
  registerForm.classList.remove('active');
  formTitle.textContent = "Bem-vindo de volta";
}

function showRegister() {
  registerForm.classList.add('active');
  loginForm.classList.remove('active');
  formTitle.textContent = "Criar a tua conta";
}

toRegister.addEventListener('click', e => { e.preventDefault(); showRegister(); });
toLogin.addEventListener('click', e => { e.preventDefault(); showLogin(); });

// ======================== Submissão dos formulários (simulação) ========================
loginForm.addEventListener('submit', e => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  if (!email) return;

  // Aqui poderias validar com backend / localStorage / firebase etc.
  localStorage.setItem('user', JSON.stringify({ name: email.split('@')[0], email }));
  document.body.classList.add('success');
  setTimeout(() => {
    window.location.href = "index.html";
  }, 1200);
});

registerForm.addEventListener('submit', e => {
  e.preventDefault();
  const name = document.getElementById('registerName').value.trim();
  const email = document.getElementById('registerEmail').value.trim();
  const password = document.getElementById('registerPassword').value;

  if (password.length < 6) {
    alert("A palavra-passe deve ter pelo menos 6 caracteres.");
    return;
  }

  localStorage.setItem('user', JSON.stringify({ name, email }));
  document.body.classList.add('success');
  setTimeout(() => {
    window.location.href = "index.html";
  }, 1200);
});

// Se já estiver logado → vai direto para index
if (localStorage.getItem('user')) {
  window.location.href = "index.html";
}
</script>
</body>
</html>
